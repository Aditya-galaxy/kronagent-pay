[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kronagent-pay"
version = "0.1.0"
description = "Governed autonomous payments — the deterministic layer that decides whether an AI agent's payment should happen"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aditya Kumar" }]
keywords = ["agentic-payments", "x402", "usdc", "circle", "ai-agents", "governance"]

dependencies = [
    "pydantic>=2.13",
    "google-genai>=2.12",
    "python-dotenv>=1.2",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
packages = ["kronpay"]

# Same ratchet as Kronagent: the rules that catch bugs, not style opinions.
#   E9 syntax/runtime · F pyflakes · B bugbear · S bandit (a payments product
#   does not get to skip the security lints)
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = [
    "E501",  # line length: the formatter's job
    "B008",  # FastAPI Depends() in a default is the documented idiom
    "B904",  # raise-without-from inside except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
